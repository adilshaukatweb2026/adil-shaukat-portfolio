<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance CSS Positioning Layout</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <h1>Advanced CSS Positioning Layout</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="layout">
        <aside>
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
            <a href="#">Link 4</a>
        </aside>

        <main>

            <div class="sticky-box">
                <h2>Sticky Box</h2>
            </div>

            <div class="position-container">
                <div class="box box1">Box 1</div>
                <div class="box box2">Box 2</div>
            </div>

            <section class="gallery" id="gallery">
                <h2>Image Gallery</h2>
                <div class="gallery-grid">
                    <img src="" alt="Gallery Image 1">
                    <img src="" alt="Gallery Image 2">
                    <img src="" alt="Gallery Image 3">
                    <img src="" alt="Gallery Image 4">
                    <img src="" alt="Gallery Image 5">
                    <img src="" alt="Gallery Image 6">
                </div>
            </section>
        </main>

        <div class="floating-buttons">
            <button>T</button>
            <button>F</button>
            <button>I</button>
        </div>

    </div>


    <footer>
        <p>© 2026 Complex Layout Design</p>
        <a href="../../index.html"></a>
    </footer>



</body>

</html>
