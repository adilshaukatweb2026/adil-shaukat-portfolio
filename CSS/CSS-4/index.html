<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Box Model</h1>

    <h2>Width Experiment</h2>

    <div class="width-one">
        Width: 300px
        <br>
        Padding: 20px
        <br>
        Border: 5px
    </div>

    <div class="width-two">
        Width: 250px
        <br>
        Padding: 10px
        <br>
        Border: 10px
    </div>

    <h2>Height Experiment</h2>

    <div class="height-one">
        Height: 200px
        <br>
        Padding: 20px
        <br>
        Border: 5px
    </div>

    <div class="height-two">
        Height: 150px
        <br>
        Padding: 15px
        <br>
        Border: 10px
    </div>

    <h2>Box Sizing Experiment</h2>

    <div class="content-box">
        Content Box
        <br>
        Width: 300px
    </div>

    <div class="border-box">
        Border Box
        <br>
        Width: 300px
    </div>
    <a href="../../index.html">Back To Home</a>

</body>

</html>
