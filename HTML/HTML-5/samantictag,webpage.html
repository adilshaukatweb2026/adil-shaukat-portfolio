<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #ddd;
            padding: 10px;
            text-align: center;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
        }
        main {
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        section {
            background-color: white;
            padding: 15px;
            border: 1px solid #ccc;
            flex: 3;
        }
        article {
            background-color: #f2f2f2;
            padding: 10px;
            border: 1px solid #ddd;
        }
        aside {
            background-color: #f2f2f2;
            padding: 10px;
            border: 1px solid #ddd;
            flex: 1;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
    <h1>My Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <section>
            <h2>About our website</h2>

           <article>
            <h3>Our Services</h3>
            <p>We provide useful services for our community.</p>
           </article>
        </section>
        <aside>
            <h3>Side information</h3>
            <p>This is additional information.</p>
        </aside>
    </main>
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
    <a href="../../index.html">Back To Home</a>

</html>
